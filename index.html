<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Всем и так похуй</title>
  <style>
    /* Сброс и базовые стили */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #2b2b2b 0%, #1a1a1a 100%);
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      padding: 1rem;
      margin: 0;
    }

    /* Карточка — главный контейнер */
    .card {
      max-width: 700px;
      width: 100%;
      padding: 4rem 3rem;
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.04);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.9),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Главный заголовок */
    .main-headline {
      font-size: clamp(2.8rem, 12vw, 5.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #f0f0f0;
      text-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      margin-bottom: 0.4rem;
      word-break: break-word;
    }

    /* Акцентное подчеркивание (декоративная линия) */
    .accent-line {
      width: 80px;
      height: 3px;
      margin: 1.2rem auto 1.8rem;
      background: linear-gradient(90deg, #888888, #bbbbbb, #888888);
      border-radius: 6px;
      opacity: 0.5;
      transition: width 0.4s ease, opacity 0.3s ease;
    }

    .card:hover .accent-line {
      width: 120px;
      opacity: 0.8;
    }

    /* Подзаголовок / доп. текст */
    .sub-text {
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 300;
      color: #9a9a9a;
      letter-spacing: 0.3px;
      line-height: 1.5;
      margin-top: 0.6rem;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .card:hover .sub-text {
      opacity: 1;
    }

    /* Маленький декоративный элемент (символ) */
    .symbol {
      display: inline-block;
      margin-top: 2rem;
      font-size: 2rem;
      color: #5a5a5a;
      letter-spacing: 6px;
      opacity: 0.25;
      transition: opacity 0.4s ease, transform 0.3s ease;
      user-select: none;
    }

    .card:hover .symbol {
      opacity: 0.5;
      transform: rotate(4deg) scale(1.02);
    }

    /* Адаптив для совсем маленьких экранов */
    @media (max-width: 480px) {
      .card {
        padding: 2.5rem 1.5rem;
        border-radius: 32px;
      }
      .accent-line {
        width: 60px;
        margin: 1rem auto 1.4rem;
      }
      .card:hover .accent-line {
        width: 90px;
      }
    }

    /* Дополнительно — очень лёгкая анимация при загрузке */
    @keyframes fadeSlide {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card {
      animation: fadeSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Основная фраза -->
    <h1 class="main-headline">всем и так похуй</h1>

    <!-- Декоративная линия -->
    <div class="accent-line"></div>

    <!-- Небольшой поясняющий текст (добавляет иронии) -->
    <p class="sub-text">но мы всё равно сделали сайт</p>

    <!-- Просто символ для завершения композиции -->
    <div class="symbol">✦ ✦ ✦</div>
  </div>
</body>
</html>
